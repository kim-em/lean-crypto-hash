name = "crypto-validation"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }
defaultTargets = ["CryptoValidation", "conformance", "official-vectors", "representation-benchmark", "streaming-benchmark"]
testRunner = "conformance"

[[require]]
name = "lean-crypto-hash"
path = "../"

[[lean_lib]]
name = "CryptoValidation"

[[lean_exe]]
name = "conformance"
root = "Conformance"

[[lean_exe]]
name = "official-vectors"
root = "OfficialVectors"

[[lean_exe]]
name = "representation-benchmark"
root = "RepresentationBenchmark"

[[lean_exe]]
name = "streaming-benchmark"
root = "StreamingBenchmark"
